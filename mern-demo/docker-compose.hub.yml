services:
  mern-backend:
    image: chibaooo/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: chibaooo/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "3000:5173"
    depends_on:
      - mern-backend
