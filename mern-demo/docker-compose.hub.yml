services:
  backend:
    image: chibaooo/mern-backend:1.0
    container_name: mern-backend
    network_mode: host
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: chibaooo/mern-frontend:2.0
    container_name: mern-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:5173"
    depends_on:
      - backend
